site_name: SeventyOneTen
site_description: AI air traffic control for X-Plane 12. You talk on the radio, a controller answers.
# The custom domain (SOT-87; the owner, 2026-10-20: "make sure the docs site is available at docs.7110atc.com"):
# the site root is the root of the gh-pages branch, so versions live at /1.0/ and /latest/, not under /docs/.
# mike builds each version with this address plus the version folder (https://docs.7110atc.com/1.0/).
site_url: https://docs.7110atc.com/
docs_dir: docs
# The release skill's default notes path is docs/pending-release-<tag>.md: never a page.
exclude_docs: |
  pending-release-*.md

# The look is the product's own: the client window's colours, dark first (docs/stylesheets/xatc.css).
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

# Versions: mike deploys one folder per docs release (1.0, 1.1, ...) and the alias `latest`; this
# makes the theme show the version selector (it reads versions.json at the site root).
extra:
  version:
    provider: mike

extra_css:
  - stylesheets/xatc.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Install and sign in: getting-started.md
      - Install on Linux: install-linux.md
      - Install on a Mac (coming soon): install-mac.md
      - Your first flight: first-flight.md
  - The window: window.md
  - Settings: settings.md
  - What ATC can do:
      - features/index.md
      - Clearance Delivery: features/clearance.md
      - Ground: features/ground.md
      - Tower: features/tower.md
      - Departure and Center: features/departure-center.md
      - Approach: features/approach.md
      - Readbacks: features/readbacks.md
      - ATIS and weather: features/atis-weather.md
      - At every position: features/everywhere.md
  - Known limitations: known-limitations.md
  - In the window:
      - The approach plan: client/approach-card.md
      - Parking: client/parking.md
      - Pre-departure clearance by text: client/pdc.md
      - Your X-Plane's data: client/xplane-data.md
  - Your data: privacy.md
  - Troubleshooting: troubleshooting.md
  - How it works: how-it-works.md
