# Pull requests and pushes to main only build and test. Nothing is deployed here: the site
# is published by a release (docs-release.yml).
name: docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --strict turns a broken internal link or a page missing from nav into a build
      # failure instead of a silent warning.
      - run: mkdocs build --strict
      # The generator of the redirect stubs for the old, unversioned page addresses.
      - run: python -m unittest discover -s tests -v
